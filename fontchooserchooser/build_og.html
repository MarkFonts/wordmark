<script id="vs" type="x-shader">
attribute vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }
</script>
<script id="fs" type="x-shader">
#extension GL_OES_standard_derivatives : enable
precision highp float;
uniform vec2  u_res;
uniform float u_dpr;
uniform vec2  u_pointer;
uniform float u_seed;
uniform int   u_preset;          // 0 = letters (bands), 1 = stars (facets)
uniform sampler2D u_idmap;

uniform vec3  u_baseColor;
uniform float u_chroma;
uniform vec3  u_palA, u_palB, u_palC, u_palD;

// letters
uniform float u_grainPx, u_grainWarp, u_glossRadius, u_shininess, u_angleGain;
uniform vec2  u_bandDir;
uniform float u_bandFreq, u_starBandFreq;

// stars
uniform vec2  u_sweepDir;
uniform float u_sweepGain, u_win, u_soft, u_ghost, u_starJitter;
uniform float u_spec, u_specWidth, u_silver, u_silverFreq;
uniform float u_warpAmt, u_warpFreq;

float hash21(vec2 p){
    return fract(sin(dot(p, vec2(127.1, 311.7)) + u_seed) * 43758.5453);
}
float vnoise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
// The base colour normalised to its brightest channel. Adding THIS brightens
// toward the foil's own metal rather than toward white — an additive of
// vec3(x) ignores Foil Base entirely and every silver area ends up the same
// washed grey whatever the base is set to.
vec3 metalOf(vec3 base) {
    float mx = max(max(base.r, base.g), base.b);
    return mx > 0.001 ? base / mx : vec3(1.0);
}

vec3 pal(float t){
    return clamp(u_palA + u_palB * cos(6.28318 * (u_palC * t + u_palD)), 0.0, 1.0);
}

void main(){
    vec2  uv  = gl_FragCoord.xy / u_res;
    float asp = u_res.x / max(u_res.y, 1.0);

    if (u_preset == 0) {
        // ── LETTERS ── continuous BANDS. The hash is a perturbation, never the
        // structure: a hash has no spatial coherence, so when it defines the read
        // you get pixelation and can never get bands. Direction+frequency define
        // the bands; the grain only breaks them up so they don't look printed.
        vec2  cell  = floor(gl_FragCoord.xy / max(u_grainPx, 1.0));   // native device px
        // Grain is measured in DEVICE pixels, not CSS pixels: multiplying by dpr
        // made every cell 2 physical pixels on a retina screen, i.e. the grain was
        // rendered at half resolution and scaled up. The warp below keeps u_dpr —
        // it is a low-frequency fold that should hold its physical size.
        float grain = hash21(cell);
        float warp  = vnoise(gl_FragCoord.xy / (80.0 * u_dpr));
        float p = fract(grain + (warp - 0.5) * 0.3);

        float bandCoord = dot(uv, normalize(u_bandDir)) * u_bandFreq;
        bandCoord += (p - 0.5) * u_grainWarp;
        // NON-LINEAR WARP — the whole difference between foil and screenprint.
        // Even bands read as a printed gradient however fine the grain is; low
        // frequency noise added to the band COORDINATE (before the fract) stretches
        // and folds them, which is what the clear-holo reference does with almost no
        // visible grain at all.
        bandCoord += vnoise(uv * u_warpFreq) * u_warpAmt;
        float t = fract(bandCoord + u_angleGain * (u_pointer.x + u_pointer.y));

        // Gloss is aspect-corrected against the sticker box (u_res is this
        // canvas, which IS the sticker's overflow box) so it stays circular.
        float d = distance(vec2(uv.x * asp, uv.y), vec2(u_pointer.x * asp, u_pointer.y));
        float g = pow(clamp(1.0 - d / max(u_glossRadius, 1e-4), 0.0, 1.0), u_shininess);
        float core = pow(clamp(1.0 - d / 0.12, 0.0, 1.0), 8.0) * 0.35;

        // SILVER BETWEEN THE BANDS. Colour occupies the middle of each cycle and
        // achromatic reflective silver fills the gap either side; u_silver is how
        // wide that gap is. This is the knob that was missing — u_chroma scales
        // colour INTENSITY everywhere, which can only wash the whole surface out,
        // and the old fixed pow() peak had no width control at all.
        //   u_silver 0   → colour edge to edge (the previous behaviour)
        //   u_silver 1   → all silver, no hue
        // Silver is chosen PER BAND SEGMENT, not as a fixed gap inside every cycle:
        // cycle = which band we are in, seg = how far along it, and a hash of
        // the pair decides whether that stretch is silver or carries hue. So silver
        // REPLACES parts of the rainbow bands in an irregular pattern rather than
        // striping every one of them identically.
        // Real hot-foil (see reference/IMG_9833.jpg): the surface is mostly NEUTRAL
        // SILVER and the colour is a minority — thin, highly saturated diffraction
        // slivers crossing the glyphs. Structure is regular (it is a grating), but
        // not every sliver fires: some run silver. So the sliver is deterministic
        // and NARROW, and a per-segment hash decides which ones carry hue.
        // SILVER IS ITS OWN BAND FIELD — a smooth 100%→0% gradation running at
        // u_silverFreq, warped by the same vnoise so it folds with everything else,
        // but deliberately NOT the rainbow's frequency. Because the two fields are
        // incommensurate they drift in and out of register, so stretches of band go
        // achromatic and others stay saturated without any tiling or hashing.
        float silverCoord = dot(uv, normalize(u_bandDir)) * u_silverFreq
                          + vnoise(uv * u_warpFreq) * u_warpAmt
                          + u_angleGain * (u_pointer.x + u_pointer.y);
        float silverField = 0.5 + 0.5 * cos(6.28318 * silverCoord);   // smooth 0..1
        // The threshold is COVERAGE-CORRECTED. For field = 0.5+0.5cos(x) the values
        // pile up near 0 and 1, so a threshold moved linearly flips most of the
        // surface at once (0.17→0.23 swinging past half). Inverting the cosine's
        // own distribution — thr = 0.5+0.5cos(pi*u_silver) — makes Silver % map
        // ~linearly onto the fraction of area that actually goes achromatic.
        // smoothstep with edge0 > edge1 is UNDEFINED in GLSL — it happened to read
        // as a descending ramp on this driver, but it also put the silver mask out
        // of phase with the band centre. Correct form: threshold picked so coverage
        // matches u_silver (inverting the cosine's own distribution), edges in order.
        float thr = 0.5 + 0.5 * cos(3.14159 * u_silver);
        float silver = smoothstep(thr - 0.13, thr + 0.13, silverField);
        float colourMask = 1.0 - silver;

        vec3 base = u_baseColor * mix(0.72, 1.15, p);
        vec3 col  = mix(base, pal(t), clamp(g * u_chroma * colourMask, 0.0, 1.0));
        // Gated by gloss, not erased by it: raw g left the ends of the lockup with
        // no highlight at all, so the silver never read as reflective out there.
        // The highlight is a feature INSIDE the silver, not a blanket over it.
        // Using silver directly meant every silver pixel got the full specular,
        // so the surface never sat at Foil Base anywhere — measured, base #5a5a63
        // was rendering as #aaacb6. Cubed, only the core of each silver band lifts
        // and its flanks stay at the base metal, which is what makes the base
        // colour actually legible on the sticker.
        // Amplitude and WIDTH are separate knobs: u_spec is how bright, u_specWidth
        // is how much of each silver band the highlight occupies. The exponent is
        // swept EXPONENTIALLY (2^5 = 32 down to 2^-2 = 0.25) rather than linearly —
        // a linear 8→1 sweep moved mean luminance by only 0.04 across the whole
        // range, which is not a control. Below 1.0 the curve inverts and the band
        // floods, so the two ends now read as different materials.
        // Width is measured in SCREEN PIXELS, not in field units. fwidth() gives how
        // fast the silver field changes per pixel here, so dividing by it converts
        // "distance from the crest" into pixels — which is the only way width 0 can
        // mean a literal hairline regardless of how wide the underlying band is.
        vec3 metal = mix(metalOf(u_baseColor), vec3(1.0), 0.25);
        // The line is measured off the PHASE, not the field. The field saturates onto
        // plateaus (so "where silver == 1" is an area, not a ridge) and its gradient
        // vanishes at the maximum, which makes fwidth there ill-conditioned. The
        // phase climbs steadily, so distance-to-band-centre / phase-change-per-pixel
        // is an honest pixel count and width 0 really is a hairline.
        float ph      = fract(silverCoord);
        float toLine  = min(ph, 1.0 - ph) / max(fwidth(silverCoord), 1e-5);  // in pixels
        float widthPx = exp2(mix(0.0, 8.0, clamp(u_specWidth, 0.0, 1.0)));   // 1px … 256px
        float specFall = (1.0 - smoothstep(0.0, widthPx, toLine)) * silver;
        col += metal * (specFall * u_spec * mix(0.4, 1.0, g)) + core;
        gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);

    } else {
        // ── STARS ── POPULATION SWEEP. Nothing here follows the pointer: the
        // pointer selects WHICH stars are lit, everywhere at once, like tilting a
        // sheet of stochastic grating. Phase is per-STAR, read from the id map.
        vec4 id = texture2D(u_idmap, uv);
        if (id.a < 0.5) discard;

        // Snap back to the same 1/64 lattice the map was built on, so antialiased
        // edges land on a neighbour's id instead of interpolating into a new one.
        float p = floor(id.r * 64.0 + 0.5) / 64.0;

        // fract() wrap makes diagonal travel non-monotonic — stars ignite and go
        // out in an order that never reads as a wipe. Intended.
        float s   = fract(p + dot(u_pointer - 0.5, normalize(u_sweepDir)) * u_sweepGain);
        float lit = smoothstep(u_win + u_soft, u_win, abs(s - 0.5) * 2.0);

        // Hue is SPATIAL, not per-id — but sampled at the star's CENTROID, not at
        // the fragment. Sampling the band field at uv gave every star an internal
        // gradient; each facet is ONE tilted mirror and must be one flat colour.
        // The centroid arrives in the id map's G/B channels (per-star data lives
        // in the per-star texture), so all fragments of a star compute an
        // identical t: flat fill is guaranteed by construction. Adjacent stars
        // still share a hue region (close centroids → same band), p still drives
        // only WHICH stars are lit, and u_starJitter roughs the bands up so they
        // aren't suspiciously perfect. u_starBandFreq stays separate from the
        // letters' frequency so the facet field cycles several times across the
        // sticker instead of sitting inside one wide band.
        vec2  suv = vec2(id.g, id.b);
        float bandT = dot(suv, normalize(u_bandDir)) * u_starBandFreq
                    + vnoise(suv * u_warpFreq) * u_warpAmt
                    + u_angleGain * (u_pointer.x + u_pointer.y);
        float t = fract(bandT + (p - 0.5) * u_starJitter);

        // Same silver/colour split as the letters, so a facet sitting in a silver
        // gap reads silver rather than disagreeing with the fill underneath it.
        // Same per-segment silver as the letters, on the star field's own frequency.
        // Same silver field as the letters, so both layers go achromatic in the
        // same places instead of disagreeing about where the foil is catching hue.
        float silverCoordS = dot(uv, normalize(u_bandDir)) * u_silverFreq
                           + vnoise(uv * u_warpFreq) * u_warpAmt
                           + u_angleGain * (u_pointer.x + u_pointer.y);
        float silverFieldS = 0.5 + 0.5 * cos(6.28318 * silverCoordS);
        float thrS = 0.5 + 0.5 * cos(3.14159 * u_silver);
        float silverS = smoothstep(thrS - 0.13, thrS + 0.13, silverFieldS);
        float colourMask = 1.0 - silverS;

        vec3  col = mix(u_baseColor, pal(t), clamp(lit * u_chroma * colourMask, 0.0, 1.0));
        // Superlinear white: the brightest facets blow to silver, so only the
        // mid-lit ones carry hue and the layer reads as metal, not stained glass.
        vec3 metalS = mix(metalOf(u_baseColor), vec3(1.0), 0.25);
        // Facets are discrete, so a pixel-width line inside one means nothing —
        // the star layer keeps a curve falloff driven by the same knob.
        float specFallS = pow(lit, exp2(mix(5.0, -2.0, clamp(u_specWidth, 0.0, 1.0))));
        col += metalS * (specFallS * u_spec * mix(0.5, 1.0, silverS));
        float a   = mix(u_ghost, 1.0, lit);   // unlit = pale ghost, never invisible
        gl_FragColor = vec4(clamp(col, 0.0, 1.0) * a, a);   // premultiplied
    }
}
</script>
<script>
/* the shipping foil, same values as the page, with the tilt parked mid-sweep */
const P={foilBase:"#baf5fd",foilChroma:1,foilGlossRadius:2.4,foilShininess:0.5,
  foilBandFreq:0.5,foilWarpAmt:1.4,foilWarpFreq:3,foilGrainPx:1,foilGrainWarp:0.14,
  foilAngleGain:0.6,foilSilverFreq:2.2,foilSilver:0.5,foilSpecWidth:0.19,foilSpecular:0};
const w=document.getElementById('w'), gc=document.createElement('canvas');
const gl=gc.getContext('webgl',{alpha:true,premultipliedAlpha:true,preserveDrawingBuffer:true});
gl.getExtension('OES_standard_derivatives');
const sh=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x;};
const pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,document.getElementById('vs').textContent));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent));
gl.linkProgram(pr);gl.useProgram(pr);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const lo=gl.getAttribLocation(pr,'a_pos');gl.enableVertexAttribArray(lo);
gl.vertexAttribPointer(lo,2,gl.FLOAT,false,0,0);
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
function paint(){
  const r=w.getBoundingClientRect(), dpr=2;
  const cw=Math.max(2,Math.ceil(r.width*dpr)), ch=Math.max(2,Math.ceil(r.height*dpr));
  gc.width=cw;gc.height=ch;
  const U=n=>gl.getUniformLocation(pr,n);
  gl.viewport(0,0,cw,ch);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(U("u_res"),cw,ch);gl.uniform1f(U("u_dpr"),dpr);
  gl.uniform2f(U("u_pointer"),0.62,0.55);gl.uniform1f(U("u_seed"),1.0);
  gl.uniform1i(U("u_preset"),0);
  gl.uniform3fv(U("u_baseColor"),hex(P.foilBase));gl.uniform1f(U("u_chroma"),P.foilChroma);
  gl.uniform3fv(U("u_palA"),[0.55,0.62,0.52]);gl.uniform3fv(U("u_palB"),[0.38,0.34,0.38]);
  gl.uniform3fv(U("u_palC"),[1,1,1]);gl.uniform3fv(U("u_palD"),[0.32,0.2,0.82]);
  gl.uniform1f(U("u_grainPx"),P.foilGrainPx);gl.uniform1f(U("u_grainWarp"),P.foilGrainWarp);
  gl.uniform1f(U("u_glossRadius"),P.foilGlossRadius);gl.uniform1f(U("u_shininess"),P.foilShininess);
  gl.uniform1f(U("u_angleGain"),P.foilAngleGain);gl.uniform2fv(U("u_bandDir"),[0.8,0.35]);
  gl.uniform1f(U("u_bandFreq"),P.foilBandFreq);gl.uniform1f(U("u_starBandFreq"),2);
  gl.uniform2fv(U("u_sweepDir"),[0.8,0.35]);gl.uniform1f(U("u_sweepGain"),1.5);
  gl.uniform1f(U("u_win"),0.15);gl.uniform1f(U("u_soft"),0);gl.uniform1f(U("u_ghost"),0);
  gl.uniform1f(U("u_starJitter"),0.58);
  gl.uniform1f(U("u_spec"),P.foilSpecular);gl.uniform1f(U("u_specWidth"),P.foilSpecWidth);
  gl.uniform1f(U("u_silver"),P.foilSilver);gl.uniform1f(U("u_silverFreq"),P.foilSilverFreq);
  gl.uniform1f(U("u_warpAmt"),P.foilWarpAmt);gl.uniform1f(U("u_warpFreq"),P.foilWarpFreq);
  gl.drawArrays(gl.TRIANGLES,0,3);
  w.style.backgroundImage='url('+gc.toDataURL()+')';
}
document.fonts.ready.then(paint); paint();
</script></body></html>
