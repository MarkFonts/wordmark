<!doctype html>
<html>
<head>
<script>
  var path = window.location.pathname;
  if (path.startsWith('/font-proofer/')) {
    window.location.replace('/font-proofer/?route=' + encodeURIComponent(path));
  } else if (path.startsWith('/recalsans/')) {
    window.location.replace('/recalsans/?route=' + encodeURIComponent(path));
  }
</script>
</head>
<body></body>
</html>
